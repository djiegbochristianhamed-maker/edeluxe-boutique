<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDELUXE — Gestion des produits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --ink:#15130E; --ink-2:#1D1A13; --ink-3:#262119; --cream:#F4EEE1; --stone:#9C9686; --blue:#5B84D9; --green:#3EA35C; --red:#D9694F;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; background:var(--ink); }
  body{ font-family:'Manrope',sans-serif; color:var(--cream); padding:24px 18px 60px; line-height:1.5; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.14em; color:var(--stone); text-transform:uppercase; margin-bottom:6px; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:24px; margin-bottom:22px; }
  h2{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin:30px 0 14px; }
  label{ display:block; font-size:12.5px; color:var(--stone); margin-bottom:6px; margin-top:14px; }
  input[type=text], input[type=number], textarea{
    width:100%; background:var(--ink-2); border:1px solid rgba(244,238,225,0.15);
    border-radius:10px; padding:11px 13px; color:var(--cream); font-family:'Manrope',sans-serif; font-size:14px;
  }
  input[type=text], input[type=number]{ height:44px; padding:0 13px; }
  textarea{ resize:vertical; }
  input:focus, textarea:focus{ outline:none; border-color:var(--blue); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .photo-btn{
    margin-top:6px; width:100%; height:44px; background:var(--ink-2); border:1px dashed rgba(244,238,225,0.25);
    border-radius:10px; color:var(--cream); font-family:'Manrope',sans-serif; font-size:13px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  #photoPreview{ margin-top:10px; display:none; }
  #photoPreview img{ width:100%; max-height:180px; object-fit:cover; border-radius:10px; }
  .switch-row{ display:flex; align-items:center; justify-content:space-between; margin-top:16px; padding:12px 14px; background:var(--ink-2); border-radius:10px; gap:12px; }
  .switch{ width:42px; height:24px; border-radius:999px; background:rgba(244,238,225,0.2); position:relative; flex-shrink:0; }
  .switch.on{ background:var(--green); }
  .switch .knob{ width:18px; height:18px; border-radius:50%; background:#fff; position:absolute; top:3px; left:3px; transition:.2s; }
  .switch.on .knob{ left:21px; }
  .btn{ margin-top:22px; width:100%; height:48px; border-radius:10px; font-family:'Manrope',sans-serif; font-size:14px; font-weight:600; cursor:pointer; border:none; }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-ghost{ background:transparent; border:1px solid rgba(244,238,225,0.25); color:var(--cream); margin-top:10px; }

  .prod-card{ display:flex; gap:12px; background:var(--ink-2); border-radius:12px; padding:12px; margin-bottom:10px; align-items:center; }
  .prod-card img{ width:56px; height:56px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--ink-3); }
  .prod-info{ flex:1; min-width:0; }
  .prod-name{ font-size:14px; font-weight:600; }
  .prod-meta{ font-size:12px; color:var(--stone); margin-top:2px; }
  .prod-badge{ display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; margin-left:6px; }
  .prod-badge.on{ background:rgba(62,163,92,0.18); color:#6BC488; }
  .prod-badge.off{ background:rgba(217,105,79,0.18); color:#E88F76; }
  .prod-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{ width:32px; height:32px; border-radius:8px; background:var(--ink-3); display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; }
  .icon-btn svg{ width:15px; height:15px; stroke:var(--cream); }
  .empty{ text-align:center; color:var(--stone); font-size:13px; padding:30px 0; }
  a.storelink{ color:var(--blue); font-size:13px; }
</style>
</head>
<body>

<div class="eyebrow">Outil interne — EDELUXE</div>
<h1>Gestion des produits</h1>

<div id="formTitle" style="font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin-bottom:4px;">Nouveau produit</div>

<label>Nom du produit</label>
<input type="text" id="fNom" placeholder="Ex. Gants isolants 1000V">

<div class="row2">
  <div>
    <label>Prix (FCFA)</label>
    <input type="number" id="fPrix" placeholder="Ex. 3500">
  </div>
  <div>
    <label>Catégorie</label>
    <input type="text" id="fCategorie" placeholder="Ex. Protection">
  </div>
</div>

<label>Description (optionnel)</label>
<textarea id="fDescription" rows="3" placeholder="Ex. Gants en cuir renforcé, isolation jusqu'à 1000V, taille unique."></textarea>

<label>Photo du produit</label>
<input type="file" id="fPhotoInput" accept="image/*" style="display:none;">
<div class="photo-btn" id="fPhotoBtn">📷 Choisir une photo</div>
<div id="photoPreview"><img id="photoPreviewImg" alt=""></div>

<div class="switch-row">
  <span style="font-size:13px;">Disponible à la vente <span style="color:var(--stone); font-weight:400; display:block; font-size:11.5px; margin-top:2px;">Désactivé = masqué du client (jamais supprimé)</span></span>
  <div class="switch on" id="fDispo"><div class="knob"></div></div>
</div>

<button class="btn btn-primary" id="btnSave">Ajouter le produit</button>
<button class="btn btn-ghost" id="btnCancelEdit" style="display:none;">Annuler la modification</button>

<h2>Tes produits</h2>
<div id="prodList"><div class="empty">Chargement...</div></div>

<p style="margin-top:30px; font-size:12px; color:var(--stone);">
  Lien de ta boutique publique (à partager aux clients) :<br>
  <a class="storelink" href="index.html" target="_blank">index.html</a> — ne partage jamais ce lien de gestion.
</p>

<script type="module">
import { db, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "./firebase-config.js";

let editingId = null;
let photoData = null;

const fPhotoBtn = document.getElementById('fPhotoBtn');
const fPhotoInput = document.getElementById('fPhotoInput');
fPhotoBtn.onclick = () => fPhotoInput.click();
fPhotoInput.onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 500;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      photoData = canvas.toDataURL('image/jpeg', 0.8);
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('photoPreviewImg').src = photoData;
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
};

const fDispo = document.getElementById('fDispo');
fDispo.onclick = () => fDispo.classList.toggle('on');

function resetForm(){
  editingId = null;
  photoData = null;
  document.getElementById('formTitle').textContent = 'Nouveau produit';
  document.getElementById('fNom').value = '';
  document.getElementById('fPrix').value = '';
  document.getElementById('fCategorie').value = '';
  document.getElementById('fDescription').value = '';
  document.getElementById('photoPreview').style.display = 'none';
  fDispo.classList.add('on');
  document.getElementById('btnSave').textContent = 'Ajouter le produit';
  document.getElementById('btnCancelEdit').style.display = 'none';
}

document.getElementById('btnSave').onclick = async () => {
  const nom = document.getElementById('fNom').value.trim();
  const prix = parseFloat(document.getElementById('fPrix').value);
  const categorie = document.getElementById('fCategorie').value.trim() || 'Autre';
  const description = document.getElementById('fDescription').value.trim();
  const disponible = fDispo.classList.contains('on');

  if(!nom || !prix){ alert('Merci de renseigner au moins le nom et le prix.'); return; }

  const data = { nom, prix, categorie, description, disponible };
  if(photoData) data.photo = photoData;

  try{
    if(editingId){
      await updateDoc(doc(db, "produits", editingId), data);
    } else {
      if(!photoData){ alert('Ajoute une photo pour ce produit.'); return; }
      await addDoc(collection(db, "produits"), { ...data, createdAt: serverTimestamp() });
    }
    resetForm();
  }catch(err){
    alert('Erreur : ' + err.message);
  }
};

document.getElementById('btnCancelEdit').onclick = resetForm;

window.editProduit = function(id, nom, prix, categorie, description, disponible, photo){
  editingId = id;
  photoData = photo || null;
  document.getElementById('formTitle').textContent = 'Modifier le produit';
  document.getElementById('fNom').value = nom;
  document.getElementById('fPrix').value = prix;
  document.getElementById('fCategorie').value = categorie;
  document.getElementById('fDescription').value = description || '';
  if(photo){
    document.getElementById('photoPreview').style.display = 'block';
    document.getElementById('photoPreviewImg').src = photo;
  }
  fDispo.classList.toggle('on', disponible);
  document.getElementById('btnSave').textContent = 'Enregistrer les modifications';
  document.getElementById('btnCancelEdit').style.display = 'block';
  window.scrollTo({ top:0, behavior:'smooth' });
};

window.supprimerProduit = async function(id){
  if(!confirm('Supprimer définitivement ce produit ?')) return;
  await deleteDoc(doc(db, "produits", id));
};

window.toggleDispo = async function(id, current){
  await updateDoc(doc(db, "produits", id), { disponible: !current });
};

const q = query(collection(db, "produits"), orderBy("createdAt", "desc"));
onSnapshot(q, (snap) => {
  const list = document.getElementById('prodList');
  if(snap.empty){
    list.innerHTML = '<div class="empty">Aucun produit pour le moment.</div>';
    return;
  }
  list.innerHTML = '';
  snap.forEach(d => {
    const p = d.data();
    const card = document.createElement('div');
    card.className = 'prod-card';
    const photoSafe = (p.photo||'').replace(/'/g, "\\'");
    const nomSafe = (p.nom||'').replace(/'/g, "\\'");
    const catSafe = (p.categorie||'').replace(/'/g, "\\'");
    const descSafe = (p.description||'').replace(/'/g, "\\'").replace(/\n/g, ' ');
    card.innerHTML = `
      <img src="${p.photo||''}" alt="">
      <div class="prod-info">
        <div class="prod-name">${p.nom}<span class="prod-badge ${p.disponible?'on':'off'}">${p.disponible?'Dispo':'Masqué'}</span></div>
        <div class="prod-meta">${(p.prix||0).toLocaleString('fr-FR')} FCFA · ${p.categorie||'—'}</div>
      </div>
      <div class="prod-actions">
        <button class="icon-btn" onclick="toggleDispo('${d.id}', ${p.disponible})" title="Afficher/masquer côté client">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12A10 10 0 1 1 12 2"/><path d="M22 2 12 12"/></svg>
        </button>
        <button class="icon-btn" onclick="editProduit('${d.id}','${nomSafe}',${p.prix},'${catSafe}','${descSafe}',${p.disponible},'${photoSafe}')" title="Modifier">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-btn" onclick="supprimerProduit('${d.id}')" title="Supprimer définitivement">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    `;
    list.appendChild(card);
  });
});
</script>
</body>
</html>
